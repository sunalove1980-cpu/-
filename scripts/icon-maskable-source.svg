<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffe2ae"/>
      <stop offset="55%" stop-color="#ffbd8a"/>
      <stop offset="100%" stop-color="#ff9d6c"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경: 전체를 채움 (OS가 알아서 원/사각형 등으로 마스킹함) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 심볼을 72%로 줄여 80% 세이프존 안에 중앙 배치 -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <ellipse cx="256" cy="432" rx="128" ry="20" fill="#7a4020" opacity="0.16"/>

    <ellipse cx="150" cy="150" rx="52" ry="70" fill="#ffd9b8"/>
    <ellipse cx="150" cy="158" rx="26" ry="41" fill="#ffb488"/>
    <ellipse cx="362" cy="150" rx="52" ry="70" fill="#ffd9b8"/>
    <ellipse cx="362" cy="158" rx="26" ry="41" fill="#ffb488"/>

    <ellipse cx="256" cy="280" rx="164" ry="148" fill="#ffd9b8"/>
    <ellipse cx="256" cy="298" rx="150" ry="128" fill="#fff1e0"/>

    <ellipse cx="150" cy="314" rx="30" ry="20" fill="#ffb3ab" opacity="0.85"/>
    <ellipse cx="362" cy="314" rx="30" ry="20" fill="#ffb3ab" opacity="0.85"/>

    <circle cx="205" cy="272" r="27" fill="#ffffff"/>
    <circle cx="307" cy="272" r="27" fill="#ffffff"/>
    <circle cx="211" cy="279" r="15.5" fill="#4a2f1c"/>
    <circle cx="313" cy="279" r="15.5" fill="#4a2f1c"/>
    <circle cx="218" cy="267" r="5.5" fill="#ffffff"/>
    <circle cx="320" cy="267" r="5.5" fill="#ffffff"/>

    <path d="M230 322 Q256 348 282 322" stroke="#a35c30" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
</svg>
