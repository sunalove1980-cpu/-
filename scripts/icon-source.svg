<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE6FF"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- open book -->
  <path d="M96 168
           C150 148 210 152 256 180
           L256 372
           C210 344 150 340 96 360
           Z"
        fill="url(#mark)" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M416 168
           C362 148 302 152 256 180
           L256 372
           C302 344 362 340 416 360
           Z"
        fill="url(#mark)" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M256 180 L256 372" stroke="#5B21B6" stroke-width="4" opacity="0.3"/>

  <!-- page lines -->
  <path d="M126 208 L226 196 M126 240 L226 228 M126 272 L226 260" stroke="#5B21B6" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  <path d="M386 208 L286 196 M386 240 L286 228 M386 272 L286 260" stroke="#5B21B6" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

  <!-- rating star, marking a favorite memory -->
  <path d="M256 100 L272 140 L316 144 L282 172 L292 216 L256 192 L220 216 L230 172 L196 144 L240 140 Z"
        fill="url(#star)" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/>

  <!-- small sparkle accent -->
  <path d="M400 356 L406 372 L422 378 L406 384 L400 400 L394 384 L378 378 L394 372 Z" fill="#FFFFFF" opacity="0.85"/>
</svg>
