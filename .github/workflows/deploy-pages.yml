name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/health-quest-webapp-vnf6aq
      - claude/lecture-realtime-sharing-web-5jnj58
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 1) 건강 퀘스트 앱 → 사이트 루트(/-/)
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      # 2) 강의 라이브 보드 → /-/live/ 하위 경로
      - run: npm ci
        working-directory: lecture-live
      - run: npm run build
        working-directory: lecture-live
        env:
          DEPLOY_TARGET: gh-pages
      - run: |
          mkdir -p dist/live
          cp -r lecture-live/dist/. dist/live/

      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 활성화되어 있지 않으면 이 액션이 자동으로 활성화한다.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
